<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Рубилка</title>
<style>
:root{
  color-scheme:light;
  --bg:#FFFFFF;--fg:#2B2F36;--muted:#5C6370;--line:#E3E6EA;--field:#D0D4DA;--hover:#F1F3F5;
  --accent:#1F5FD6;--accent-hover:#184CB0;--link:#1F5FD6;--error:#D92D20;--success:#188038;
  --overlay-bg:#0D1216;
  --font:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16181C;--fg:#E6E8EB;--muted:#9AA1AB;--line:#2C3036;--field:#3A3F46;--hover:#22252A;
  --accent:#2F6BE0;--accent-hover:#3D7BF2;--link:#6EA2FF;--error:#FF6B6B;--success:#4CC27A;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16181C;--fg:#E6E8EB;--muted:#9AA1AB;--line:#2C3036;--field:#3A3F46;--hover:#22252A;
  --accent:#2F6BE0;--accent-hover:#3D7BF2;--link:#6EA2FF;--error:#FF6B6B;--success:#4CC27A;color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%;background:var(--bg);color:var(--fg)}
body{font:15px/1.4 var(--font);overflow:hidden}
.app{height:100%;display:grid;grid-template-columns:1fr 320px}
.stage{position:relative;background:var(--overlay-bg);min-width:0;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.panel{background:var(--bg);border-left:1px solid var(--line);overflow-y:auto;min-height:0;
  padding-block:16px;padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:16px}
.group{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:8px}
.group:first-child{border-top:0;padding-top:0}
.kv{width:100%;border-collapse:collapse}
.kv td{padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.kv tr:last-child td{border-bottom:0}
.kv td:last-child{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.lab{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.lab span{font-family:var(--mono);color:var(--fg)}
input[type=range]{width:100%;accent-color:var(--accent);height:24px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:500;color:var(--muted);padding:6px 0;border-bottom:1px solid var(--line)}
.tbl td{padding:6px 0;border-bottom:1px solid var(--line)}
.tbl th:not(:first-child),.tbl td:not(:first-child){text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;padding-left:10px;white-space:nowrap}
.tbl td:first-child{max-width:0;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl tr.dead td{color:var(--muted);text-decoration:line-through}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:8px;vertical-align:-1px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.btn{height:44px;padding:0 20px;border-radius:4px;font:500 15px var(--font);cursor:pointer;border:1px solid var(--field);background:var(--bg);color:var(--fg)}
.seg .btn{font-size:13px;padding:0}
.btn:hover{border-color:var(--link);color:var(--link)}
.btn.primary,.seg .btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover,.seg .btn.on:hover{background:var(--accent-hover);border-color:var(--accent-hover);color:#fff}
.btn:focus-visible,input:focus-visible{outline:2px solid var(--link);outline-offset:2px}
#msg{font-size:13px;min-height:18px;margin:0}
#msg.err{color:var(--error)} #msg.ok{color:var(--success)}
.log{list-style:none;margin:0;padding:0;font-size:13px}
.log li{padding:6px 0;border-bottom:1px solid var(--line)}
.log li:last-child{border-bottom:0}
.log time{font-family:var(--mono);color:var(--muted);margin-right:8px}
.log .bad{color:var(--error)} .log .good{color:var(--success)}
@media (max-width:640px){
  .app{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .panel{border-left:0;border-top:1px solid var(--line);max-height:42vh;
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px));gap:12px}
  .group{padding-top:12px}
}
.bar{position:relative;height:6px;background:var(--hover);border-radius:4px;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent)}
.bar b{position:absolute;top:0;bottom:0;left:35%;width:30%;border-left:1px solid var(--muted);border-right:1px solid var(--muted)}
.btns .btn small,.btn small{font-family:var(--mono);font-weight:400;font-size:13px;opacity:.8;margin-left:4px}
#build .btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:var(--hover)}
.tbl tr.sel td{color:var(--link)}
.dname{grid-column:1/-1;display:flex;align-items:center;font-size:13px;color:var(--muted)}
.chk{display:flex;align-items:center;gap:8px;height:44px;font-size:15px;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--accent);margin:0}
.menu{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto}
.mwrap{max-width:1040px;margin:0 auto;padding-block:40px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.mtop{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.mlogo{font-size:20px;font-weight:600}
#mMsg{color:var(--error);font-size:13px;min-height:18px;margin:8px 0 16px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:40px}
.msec{display:flex;flex-direction:column;gap:8px;min-width:0}
.mgrp{display:contents}
.mh{font-size:17px;font-weight:600;margin:0 0 4px}
.inp{height:44px;border:1px solid var(--field);border-radius:4px;padding:0 12px;font:15px var(--font);background:var(--bg);color:var(--fg);width:100%;box-sizing:border-box}
.inp:focus{outline:none;border-color:var(--link);box-shadow:0 0 0 3px rgba(31,95,214,.15)}
.swatches{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}
.sw2{height:32px;border-radius:4px;border:2px solid transparent;cursor:pointer;padding:0}
.sw2.on{border-color:var(--fg);box-shadow:inset 0 0 0 2px var(--bg)}
.sw2:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.mlist{display:flex;flex-direction:column}
.mrow{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.mrt{display:flex;flex-direction:column;gap:2px;min-width:0}
.mrt b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrt span{font-size:13px;color:var(--muted)}
.mbt{display:flex;gap:8px;flex-wrap:wrap}
.mbt .btn{padding:0 12px;font-size:13px}
.btn.danger{border-color:var(--error);color:var(--error)}
.btns3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btns3 .btn{padding:0 6px}
.dock{position:absolute;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px;padding:6px;background:var(--bg);border:1px solid var(--line);border-radius:6px;max-width:calc(100% - 24px);box-sizing:border-box}
.dock .seg{grid-template-columns:repeat(3,auto)}
.dock .seg .btn{padding:0 14px}
#dockInfo{font:13px var(--mono);color:var(--muted);white-space:nowrap;padding-right:6px;overflow:hidden;text-overflow:ellipsis}
#dockInfo:empty{display:none}
.sheet{position:absolute;top:12px;left:12px;width:min(380px,calc(100% - 24px));max-height:calc(100% - 96px);overflow-y:auto;box-sizing:border-box;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:8px}
.sheet.offer{left:auto;right:12px}
.shead{display:flex;justify-content:space-between;align-items:center}
.shead b{font-size:17px;font-weight:600}
.shead .btn{padding:0 12px;font-size:13px}
.seg2{grid-template-columns:1fr 1fr}
.hqst{font-size:13px;margin:0;color:var(--muted)} .hqst.err{color:var(--error)}
.trow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.tt{display:flex;flex-direction:column;gap:2px;min-width:0;font-size:13px}
.tt b{font-size:15px;font-weight:500}
.tt .pl{color:var(--success)} .tt .mi{color:var(--error)}
.trow .btn{padding:0 12px;font-size:13px;flex:none}
.trow .chk{flex:none;font-size:13px;font-family:var(--mono)}
.btn:disabled{opacity:.45;cursor:default}
.btn:disabled:hover{border-color:var(--field);color:var(--fg)}
.hqn{font-size:13px;color:var(--muted);margin:0 0 8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <div class="stage" id="stage"><canvas id="cv"></canvas>
    <div class="dock" id="dock" hidden>
      <div class="seg" id="umode"><button class="btn on" data-u="0">Войска</button><button class="btn" data-u="1">Флот</button><button class="btn" data-u="2">Артиллерия</button></div>
      <span id="dockInfo"></span>
    </div>
    <div class="sheet" id="tre" hidden>
      <div class="shead"><b id="treT">Договор</b><button class="btn" id="treClose">Закрыть</button></div>
      <p class="hqst" id="treSt"></p>
      <div id="treTerms"></div>
      <button class="btn primary" id="treSend">Предложить</button>
    </div>
    <div class="sheet offer" id="offer" hidden>
      <div class="shead"><b id="ofT"></b></div>
      <ul class="log" id="ofList"></ul>
      <div class="btns"><button class="btn primary" id="ofYes">Принять</button><button class="btn" id="ofNo">Отклонить</button></div>
    </div>
    <div class="sheet" id="hq" hidden>
      <div class="shead"><b>Столица</b><button class="btn" id="hqClose">Закрыть</button></div>
      <div class="seg seg2" id="hqTabs"><button class="btn on" data-t="0">Изучения</button><button class="btn" data-t="1">Распределение</button></div>
      <p class="hqst" id="hqSt"></p>
      <div id="hqTech"></div>
      <div id="hqAlloc" hidden>
        <label class="lab" for="al0">Экипировка <span id="al0V"></span></label><input type="range" id="al0" min="0" max="100"><p class="hqn" id="al0N"></p>
        <label class="lab" for="al1">Стройка <span id="al1V"></span></label><input type="range" id="al1" min="0" max="100"><p class="hqn" id="al1N"></p>
        <label class="lab" for="al2">Продажа за границу <span id="al2V"></span></label><input type="range" id="al2" min="0" max="100"><p class="hqn" id="al2N"></p>
      </div>
    </div>
  </div>
  <aside class="panel" id="gamePanel">
    <div class="group">
      <table class="kv">
        <tr><td>Армия</td><td id="sArmy">0</td></tr>
        <tr><td>Прирост</td><td id="sInc">0</td></tr>
        <tr><td>Золото</td><td id="sGold">0</td></tr>
        <tr><td>Еда</td><td id="sFood">0</td></tr>
        <tr><td>Железо</td><td id="sIron">0</td></tr>
        <tr><td>Торговля</td><td id="sTrade">0</td></tr>
        <tr><td>Территория</td><td id="sTer">0</td></tr>
        <tr><td>Усталость</td><td id="sWr">0</td></tr>
      </table>
      <div class="bar"><i id="armyBar"></i><b></b></div>
    </div>
    <div class="group">
      <label class="lab" for="pct">Сила атаки <span id="pctV">40%</span></label>
      <input type="range" id="pct" min="10" max="100" step="5" value="40">
      <button class="btn" id="retreat">Отступить</button>
      <p id="msg"></p>
    </div>
    <div class="group">
      <div class="btns" id="build">
        <button class="btn" data-b="1">Город <small id="cCity"></small></button>
        <button class="btn" data-b="2">Форт <small id="cFort"></small></button>
        <button class="btn" data-b="3">Добыча <small id="cQuarry"></small></button>
        <button class="btn" data-b="4">Батарея <small id="cArt"></small></button>
        <label class="chk"><input type="checkbox" id="resL">Ресурсы</label>
      </div>
    </div>
    <div class="group">
      <table class="tbl"><thead><tr><th>Страна</th><th>Земля</th><th>Армия</th></tr></thead><tbody id="lb"></tbody></table>
      <div class="btns" id="dipl" hidden>
        <span class="dname" id="dName"></span>
        <button class="btn" id="peace">Объявить войну</button>
        <button class="btn" id="treBtn">Договор</button>
      </div>
    </div>
    <div class="group" id="logBox" hidden>
      <ul class="log" id="log"></ul>
    </div>
    <div class="group">
      <label class="chk"><input type="checkbox" id="dens">Плотность войск</label>
      <div class="seg" id="speed">
        <button class="btn on" data-s="1">×1</button><button class="btn" data-s="2">×2</button><button class="btn" data-s="3">×3</button>
      </div>
      <div class="btns3">
        <button class="btn" id="pause">Пауза</button>
        <button class="btn" id="saveBtn">Сохранить</button>
        <button class="btn primary" id="menuBtn">Меню</button>
      </div>
    </div>
  </aside>
  <aside class="panel" id="edPanel" hidden>
    <div class="group">
      <div class="seg" id="edTools">
        <button class="btn on" data-t="1">Равнина</button><button class="btn" data-t="2">Лес</button><button class="btn" data-t="3">Горы</button>
        <button class="btn" data-t="0">Вода</button><button class="btn" data-t="s">Старт</button><button class="btn" data-t="h">Рука</button>
      </div>
      <label class="lab" for="edSize">Кисть <span id="edSizeV">4</span></label>
      <input type="range" id="edSize" min="1" max="16" value="4">
    </div>
    <div class="group">
      <div class="btns"><button class="btn" id="edRandom">Случайная основа</button><button class="btn" id="edClear">Всё вода</button></div>
    </div>
    <div class="group">
      <label class="lab" for="edName">Название карты</label>
      <input id="edName" class="inp" maxlength="32" value="Моя карта">
      <p id="edMsg" class="qline"></p>
      <div class="btns"><button class="btn primary" id="edSave">Сохранить карту</button><button class="btn" id="edExit">В меню</button></div>
    </div>
  </aside>
</div>
<div id="menu" class="menu" hidden>
  <div class="mwrap">
    <div class="mtop"><span class="mlogo">Рубилка</span><button class="btn" id="mLang">EN</button><button class="btn primary" id="mResume" hidden>Вернуться в игру</button></div>
    <p id="mMsg"></p>
    <div class="mgrid">
      <section class="msec">
        <h2 class="mh">Новая игра</h2>
        <label class="lab" for="mMap">Карта</label>
        <select id="mMap" class="inp"></select>
        <div id="mEu" class="mgrp" hidden><label class="lab" for="mCountry">Страна</label>
        <select id="mCountry" class="inp"></select></div>
        <div id="mStd" class="mgrp"><label class="lab" for="mName">Название страны</label>
        <input id="mName" class="inp" maxlength="24">
        <span class="lab">Цвет</span>
        <div id="mColors" class="swatches"></div>
        <label class="lab" for="mRiv">Соперников <span id="mRivV">5</span></label>
        <input type="range" id="mRiv" min="1" max="5" value="5"></div>
        <button class="btn primary" id="mStart">Начать</button>
      </section>
      <section class="msec">
        <h2 class="mh">Сохранения</h2>
        <div id="mSaves" class="mlist"></div>
        <button class="btn" id="mImport">Загрузить из файла</button>
        <input type="file" id="mFile" accept=".save,.json,.txt" hidden>
      </section>
      <section class="msec">
        <h2 class="mh">Свои карты</h2>
        <div id="mMaps" class="mlist"></div>
        <button class="btn" id="mNewMap">Нарисовать карту</button>
      </section>
    </div>
  </div>
</div>

<script>
// ---------- язык: русский или английский, по языку браузера; переключается в меню ----------
const LANG=(()=>{try{const v=localStorage.getItem('rub_lang');if(v==='ru'||v==='en')return v}catch(e){}
  return/^(ru|uk|be|kk)/i.test(navigator.language||'')?'ru':'en'})();
const Lg=(ru,en)=>LANG==='en'?en:ru;
(function(){if(LANG!=='en')return;document.documentElement.lang='en';document.title='Rubilka';
  const D={'Войска':'Troops','Флот':'Fleet','Артиллерия':'Artillery','Столица':'Capital','Закрыть':'Close','Изучения':'Research',
  'Распределение':'Budget','Экипировка':'Equipment','Стройка':'Construction','Продажа за границу':'Exports','Армия':'Army',
  'Прирост':'Growth','Золото':'Gold','Еда':'Food','Железо':'Iron','Торговля':'Trade','Территория':'Territory','Усталость':'War weariness','Сила атаки':'Attack size',
  'Отступить':'Retreat','Город':'City','Форт':'Fort','Добыча':'Mine','Батарея':'Battery','Ресурсы':'Resources','Страна':'Country',
  'Земля':'Land','Война':'War','Объявить войну':'Declare war','Договор':'Treaty','Предложить':'Propose','Принять':'Accept','Отклонить':'Decline','Плотность войск':'Troop density','Пауза':'Pause','Сохранить':'Save','Меню':'Menu','Равнина':'Plains',
  'Лес':'Forest','Горы':'Mountains','Вода':'Water','Старт':'Start','Рука':'Pan','Кисть':'Brush','Случайная основа':'Random base',
  'Всё вода':'All water','Название карты':'Map name','Сохранить карту':'Save map','В меню':'Menu','Рубилка':'Rubilka',
  'Вернуться в игру':'Back to game','Новая игра':'New game','Название страны':'Country name','Цвет':'Color','Карта':'Map',
  'Соперников':'Rivals','Начать':'Start','Сохранения':'Saves','Загрузить из файла':'Load from file','Свои карты':'My maps',
  'Нарисовать карту':'Draw a map'};
  const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;
  while(n=w.nextNode()){const t=n.nodeValue.trim();if(D[t])n.nodeValue=n.nodeValue.replace(t,D[t])}
  const e=document.getElementById('edName');if(e)e.value='My map'})();
const K=2,A=K*K;

  att=new Int32Array(N);dlt=new Float32Array(N);since=new Float32Array(N);src=new Int32Array(N).fill(-1);
  resT=new Uint8Array(N);csz=new Uint8Array(N);res=new Float32Array(N);
  off.width=W;off.height=H;img=octx.createImageData(W,H);if(glOK){glOwn=new Uint8Array(N);gl.uniform2f(glU.uGrid,W,H)}}
function mulberry(a){return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function noise(cell){
  const gw=Math.ceil(W/cell)+2,gh=Math.ceil(H/cell)+2,g=new Float32Array(gw*gh);
  for(let i=0;i<g.length;i++)g[i]=rnd();
  return(x,y)=>{const fx=x/cell,fy=y/cell,ix=fx|0,iy=fy|0;let tx=fx-ix,ty=fy-iy;
    tx=tx*tx*(3-2*tx);ty=ty*ty*(3-2*ty);
    const a=g[iy*gw+ix],b=g[iy*gw+ix+1],c=g[(iy+1)*gw+ix],d=g[(iy+1)*gw+ix+1];
    return a+(b-a)*tx+(c-a)*ty+(a-b-c+d)*tx*ty};
}

function genMap(){
  rnd=mulberry((Math.random()*1e9)|0);
  const n1=noise(16*K),n2=noise(8*K),n3=noise(4*K),fo=noise(6*K);
  const h=new Float32Array(N);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const dx=(x/W-.5)*2,dy=(y/H-.5)*2;
    h[y*W+x]=n1(x,y)*.55+n2(x,y)*.3+n3(x,y)*.15-Math.max(Math.abs(dx),Math.abs(dy))**3*.35;
  }
  const s=Array.from(h).sort((a,b)=>a-b),sea=s[(N*.3)|0],mt=s[(N*.92)|0];
  terr=new Uint8Array(N);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=y*W+x;
    terr[i]=h[i]<sea?0:h[i]>mt?3:fo(x,y)>.62?2:1}
  buildNB();
  const comp=new Int32Array(N).fill(-1);let best=-1,bestN=0,id=0;
  for(let i=0;i<N;i++){if(!terr[i]||comp[i]>=0)continue;
    const st=[i];comp[i]=id;let c=0;
    while(st.length){const v=st.pop();c++;for(let k=0;k<4;k++){const j=NB[v*4+k];if(j>=0&&terr[j]&&comp[j]<0){comp[j]=id;st.push(j)}}}
    if(c>bestN){bestN=c;best=id}id++}

}
function buildNB(){
  NB=new Int32Array(N*4).fill(-1);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=y*W+x;
    if(x>0)NB[i*4]=i-1;if(x<W-1)NB[i*4+1]=i+1;if(y>0)NB[i*4+2]=i-W;if(y<H-1)NB[i*4+3]=i+W}

function genResources(){
  // залежи: богатые пятна, чаще в горах и рядом
  // золото — на холмах и в лесах, еда — на равнинах, железо — в горах
  const fG=[noise(7*K),noise(3*K)],fF=[noise(8*K),noise(3*K)],fI=[noise(7*K),noise(3*K)];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=y*W+x;
    if(!terr[i]){res[i]=0;resT[i]=0;continue}const t=terr[i];
    const vs=[0,fG[0](x,y)*.7+fG[1](x,y)*.3+(t===2?.06:0),fF[0](x,y)*.7+fF[1](x,y)*.3+(t===1?.08:-.1),fI[0](x,y)*.7+fI[1](x,y)*.3+(t===3?.22:-.06)];
    let k=1;for(let q=2;q<=3;q++)if(vs[q]>vs[k])k=q;
    const v=Math.max(0,Math.min(1,(vs[k]-.63)/.27))**1.3;res[i]=v;resT[i]=v>0?k:0}
}
// что добывать в этой точке: самый богатый вид залежей вокруг (5×5 по старым клеткам)
function qinfo(i){
  const sum=[0,0,0,0];let n=0;const R=K;
  for(let dy=-R;dy<=R;dy++)for(let dx=-R;dx<=R;dx++){const x=cx_(i)+dx,y=cy_(i)+dy;
    if(x<0||y<0||x>=W||y>=H)continue;const j=y*W+x;sum[resT[j]]+=res[j];n++}

}

// ---------- стены столицы: кольцо укреплений, которое надо долго ломать ----------
function isWall(i){const o=own[i];if(o<0||!P[o].alive)return false;const d=capZone(i);return d>=WALL_R0*K&&d<=WALL_R1*K}
function hitWall(i,dmg){

  if(o===0&&clock-wallLog>20){wallLog=clock;addLog(Lg('Штурм стен столицы','Your capital walls are under assault'),'bad')}
  if(wall[i]<=0){wall[i]=0;if(o===0||(attackerOf===0))addLog(o===0?Lg('Стены столицы пробиты','Your capital walls are breached'):Lg(`Пробиты стены столицы «${P[o].name}»`,`${P[o].name} capital walls breached`),o===0?'bad':'good')}
}
let attackerOf=-1;
const die=(o,n)=>{if(o>=0&&n>0)P[o].dead=(P[o].dead||0)+n};   // погибшие за тик: из них копится усталость
// ---------- войска живут в клетках ----------
function syncT(){for(const p of P)p.troops=0;for(let i=0;i<N;i++)if(own[i]>=0)P[own[i]].troops+=tr[i]}
const nbOwn=(i,t)=>{for(let k=0;k<4;k++){const j=NB[i*4+k];if(j>=0&&terr[j]&&own[j]===t)return true}return false};

function withdraw(a,amount,seeds){
  let got=0;const seen=new Uint8Array(N),q=[];
  for(const v of seeds)if(v>=0&&own[v]===a&&!seen[v]){seen[v]=1;q.push(v)}
  const c=P[a].cap;if(!q.length&&c>=0&&own[c]===a){seen[c]=1;q.push(c)}
  for(let h=0;h<q.length&&got<amount;h++){const v=q[h];
    const take=Math.min(tr[v]*.85,amount-got);tr[v]-=take;got+=take;
    for(let k=0;k<4;k++){const j=NB[v*4+k];if(j>=0&&!seen[j]&&own[j]===a){seen[j]=1;q.push(j)}}}
  P[a].troops-=got;return got;
}
// вернуть бойцов на карту в точке (или в ближайшей своей клетке)
function deposit(a,amount,cell){
  if(amount<=0||!P[a].alive)return;
  if(cell<0||own[cell]!==a){let best=-1,bd=1e9;
    if(cell>=0)for(let i=0;i<N;i++)if(own[i]===a){const d=Math.abs(cx_(i)-cx_(cell))+Math.abs(cy_(i)-cy_(cell));if(d<bd){bd=d;best=i}}
    cell=best>=0?best:P[a].cap;if(own[cell]!==a)return}
  const cs=[cell];for(let k=0;k<4;k++){const j=NB[cell*4+k];if(j>=0&&own[j]===a)cs.push(j)}
  for(const v of cs)tr[v]+=amount/cs.length;P[a].troops+=amount;
}
// новобранцы: половина — в столице и городах, половина — по всей снабжаемой земле
function spawn(){
  const nSup=P.map(()=>0),srcs=P.map(()=>[]);
  for(let i=0;i<N;i++){const o=own[i];if(o<0||dist[i]<0)continue;nSup[o]++;if(dist[i]===0)srcs[o].push(i)}
  for(let i=0;i<N;i++){const o=own[i];if(o<0||dist[i]<0)continue;tr[i]+=P[o].gr*.5/nSup[o]}
  for(let o=0;o<P.length;o++){const sv=srcs[o];if(!sv.length)continue;for(const i of sv)tr[i]+=P[o].gr*.5/sv.length}
}
// войска сами стекают к фронту и выравниваются вдоль него; в котле без снабжения тают
function flow(){

    if(dist[i]<0&&clock-cut[i]>MELT_T){const m=.008/(1+MD(P[o]).pocket);die(o,tr[i]*m);tr[i]*=1-m}
    const f=fd[i];
    if(f>0){let n=0;const nb=[];for(let k=0;k<4;k++){const j=NB[i*4+k];if(j>=0&&own[j]===o&&fd[j]>=0&&fd[j]<f)nb[n++]=j}
      if(n){const m=tr[i]*(urban[i]?FLOW*.15:FLOW)*Math.max(.2,1+MD(P[o]).flow);dlt[i]-=m;for(let k=0;k<n;k++)dlt[nb[k]]+=m/n}}   // делим поровну — без полос

// фронт сам давит: где мои у границы сильнее обороны соседа — клетка постепенно переходит ко мне
function front(){

  {id:'mil',n:Lg('Ополчение','Militia'),c:200,e:{spawn:.2},p:{def:-.1},d:Lg('прирост +20%','growth +20%'),m:Lg('защита −10%','defense −10%')},
  {id:'depot',n:Lg('Тыловые склады','Rear depots'),c:250,e:{pocket:1},p:{gold:-.1},d:Lg('котлы держатся вдвое дольше','encircled troops hold twice as long'),m:Lg('золото −10%','gold −10%')},
  {id:'armor',n:Lg('Броня','Armor'),c:450,e:{arrow:.4},p:{flow:-.2},d:Lg('стрелки прорываются быстрее','arrow attacks break through faster'),m:Lg('войска медленнее идут к фронту','troops reach the front slower')}];
function ensureP(p){if(!p.tOwn)p.tOwn=[];if(!p.tOn)p.tOn=[];if(!p.tCd)p.tCd={};if(!p.alloc)p.alloc=[33,33,34];
  if(!p.marks)p.marks=[];if(!p.costArt)p.costArt=120;if(!p.trib)p.trib=[]}

const eqK=p=>.5+(p.alloc?p.alloc[0]:33)/66;                   // экипировка: насколько работают изучения
const buildT=p=>Math.round(3+14*(1-(p.alloc?p.alloc[1]:33)/100)**2);

function calcMods(p){const md={atk:0,def:0,flow:0,spawn:0,wall:0,loss:0,gold:0,pocket:0,arrow:0};
  const ek=eqK(p),pm=penMul(p),many=cpow(p)>=6;

    for(const k in t.e)md[k]+=t.e[k]*ek;

  // снабжение идёт от столицы; отрезанный город держится на своих складах, береговой форт снабжает морем
  const capR=new Uint8Array(N),q=new Int32Array(N);let h=0,t=0;
  for(let p=0;p<P.length;p++){const c=P[p].cap;if(P[p].alive&&own[c]===p){capR[c]=1;q[t++]=c}}
  while(h<t){const v=q[h++];for(let k=0;k<4;k++){const j=NB[v*4+k];if(j>=0&&!capR[j]&&own[j]===own[v]){capR[j]=1;q[t++]=j}}}
  dist.fill(-1);h=t=0;
  for(let p=0;p<P.length;p++){const c=P[p].cap;if(P[p].alive&&own[c]===p){dist[c]=0;src[c]=c;q[t++]=c}}
  for(const k in depotT)if(bld[k]!==1||own[k]<0||capR[k])delete depotT[k];
  for(let i=0;i<N;i++){const o=own[i];if(o<0||dist[i]>=0)continue;
    if(bld[i]===1){if(capR[i]){dist[i]=0;src[i]=i;q[t++]=i;continue}
      if(depotT[i]===undefined)depotT[i]=clock;
      const left=DEPOT_T*(1+MD(P[o]).pocket)-(clock-depotT[i]);
      if(left>0){dist[i]=0;src[i]=i;q[t++]=i}
      else if(left>-1&&o===0)addLog(Lg('Склады отрезанного города пусты: войска вокруг начнут таять','The cut-off city is out of supplies: troops around it will start to melt'),'bad')}
    else if(bld[i]===2&&port(i)){dist[i]=1;src[i]=i;q[t++]=i}}   // порт: снабжает, но новобранцев не даёт
  while(h<t){const v=q[h++];
    for(let k=0;k<4;k++){const j=NB[v*4+k];if(j>=0&&own[j]===own[v]&&dist[j]<0){dist[j]=dist[v]+1;src[j]=src[v];q[t++]=j}}}
  for(let i=0;i<N;i++){if(own[i]<0||dist[i]>=0)cut[i]=0;else if(!cut[i])cut[i]=clock+.001}
  fd.fill(-1);{const fq=new Int32Array(N);let fh=0,ft=0;
    for(let i=0;i<N;i++){const o=own[i];if(o<0)continue;
      for(let k=0;k<4;k++){const j=NB[i*4+k];if(j>=0&&own[j]>=0&&own[j]!==o&&!atPeace(o,own[j])){fd[i]=0;fq[ft++]=i;break}}}
    while(fh<ft){const v=fq[fh++];for(let k=0;k<4;k++){const j=NB[v*4+k];if(j>=0&&own[j]===own[v]&&fd[j]<0){fd[j]=fd[v]+1;fq[ft++]=j}}}}
  syncPuppets();puppetRevolts();
  worldLife();
  for(const p of P){ensureP(p);calcMods(p)}
  // стены: чинятся, если их не бьют и есть снабжение; siege — сколько участков кольца повреждено
  {let mx=1;for(const p of P)if(p.alive)mx=Math.max(mx,p.cells);
    for(const p of P){p.mob=1+.6*Math.max(0,1-p.cells/(.45*mx));for(const k in p.hate)p.hate[k]*=.985}}

  for(let i=0;i<N;i++){if(!isWall(i)){wall[i]=0;continue}

        else if(own[j]<0||!atWar(o,own[j]))neutral=true;else nbr[own[j]]=(nbr[own[j]]||0)+1}}

      if(o===0)addLog(Lg(`Ваши войска окружены: ${comp.length} кл., ${Math.round(comp.reduce((s,v)=>s+tr[v],0))} бойцов`,`Your troops are encircled: ${comp.length} tiles, ${Math.round(comp.reduce((s,v)=>s+tr[v],0))} troops`),'bad');

    if(neutral||!ks.length||clock-minCut<POCKET_T*(1+MD(P[o]).pocket))continue;
    if(comp.length>Math.max(60*A,P[o].cells*.15))continue;   // большой котёл сам не сдаётся — его надо дожимать

      addLog(Lg(`Котёл: «${P[o].name}» сдаёт ${comp.length} кл. «${P[dom].name}»`,`Pocket: ${P[o].name} surrenders ${comp.length} tiles to ${P[dom].name}`),dom===0?'good':o===0?'bad':'');
  }
}

function addLog(t,cls){
  const m=Math.floor(clock/60),s=Math.floor(clock%60);
  logArr.unshift({t,cls,time:`${m}:${String(s).padStart(2,'0')}`});if(logArr.length>30)logArr.pop();renderLog();
}
function renderLog(){
  $('logBox').hidden=!logArr.length;
  $('log').innerHTML=logArr.slice(0,8).map(l=>`<li><time>${l.time}</time><span class="${esc(l.cls||'')}">${esc(l.t)}</span></li>`).join('');

function conquer(i,a){
  const o=own[i];
  if(o>=0){P[o].cells--;if(bld[i]===1){P[o].cities--;csz[i]=Math.max(1,(csz[i]||1)-1);P[o].wr=(P[o].wr||0)+3;P[a].wr=Math.max(0,(P[a].wr||0)-4)}P[o].hate[a]=(P[o].hate[a]||0)+1;
    let r=-1;for(let k=0;k<4;k++){const j=NB[i*4+k];if(j>=0&&own[j]===o){r=j;break}}
    if(r>=0)tr[r]+=tr[i]*.4;P[o].troops-=tr[i]*(r>=0?.6:1);die(o,tr[i]*(r>=0?.6:1))}
  tr[i]=0;prog[i]=0;wall[i]=0;
  own[i]=a;P[a].cells++;cut[i]=0;since[i]=clock;if(bld[i]===1)P[a].cities++;
  if(bld[i]>=10||bld[i]===4){bld[i]=0;delete artCd[i]}   // стройка и батарея при захвате пропадают
  if(bld[i]===2){bld[i]=0;forts=forts.filter(f=>f!==i);delete fortHits[i]}   // форт при захвате разрушается
  if(bld[i]===3&&o>=0&&(o===0||a===0))addLog(a===0?Lg(`Отбит карьер у «${P[o].name}»`,`Mine captured from ${P[o].name}`):Lg(`«${P[a].name}» захватил ваш карьер`,`${P[a].name} captured your mine`),a===0?'good':'bad');
  if(o>=0&&i===P[o].cap)capitulate(o,a);

// ---------- усталость от войны ----------
// копится от своих погибших (в долях лимита армии), сама спадает; взятые города её снимают, потерянные — добавляют
const GOV=Lg(['хунта','директория','временное правительство','военный совет'],['junta','directorate','provisional government','military council']);
function weariness(){
  for(let o=0;o<P.length;o++){const p=P[o],d=p.dead||0;p.dead=0;if(!p.alive||p.rebel)continue;
    p.wr=Math.min(100,(p.wr||0)*.9994+15*d/cap(p));
    const st=p.wr>=80?2:p.wr>=50?1:0;
    if(o===0&&!noEnd.coup&&st>(p.wrSt||0))addLog(st===2?Lg('Генералы ропщут из-за потерь. Ещё немного, и будет переворот','The generals are angry about the losses. A coup is close'):Lg('Страна устала от войны: прирост падает, в городах волнения','The country is weary of war: growth falls, cities are restless'),'bad');
    if(p.wr<(p.wrSt===2?70:40))p.wrSt=st;else p.wrSt=Math.max(p.wrSt||0,st);
    if(p.wr>=100&&clock-(p.coupT??-999)>90)coup(o)}}   // новой власти дают 90 с удержаться
function coup(o){
  const p=P[o],old=p.name;p.base=p.base||old;
  p.name=`${p.base}: ${rp(GOV)}`;p.wr=35;p.coupT=clock;p.wrSt=0;p.hate={};p.tOn=[];calcMods(p);
  for(let i=0;i<N;i++)if(own[i]===o)tr[i]*=.8;   // чистки в армии
  if(o===0&&!noEnd.coup){noEnd.coup=true;setMsg(Lg('Переворот: армия не простила потерь, вас свергли','Coup: the army did not forgive the losses, you are overthrown'),'err');
    addLog(Lg('Вас свергли. Страной правит новая власть, можно смотреть дальше или начать заново','You were overthrown. A new government rules; keep watching or start over'),'bad')}
  else addLog(Lg(`Переворот в «${old}»: власть взяла ${p.name.slice(p.base.length+2)}`,`Coup in ${old}: a ${p.name.slice(p.base.length+2)} took power`),P[0].alive&&atWar(0,o)?'good':'');
}
function capitulate(o,a){

  P[a].cells+=n;P[a].cities+=c;P[o].cells=0;P[o].cities=0;P[o].alive=false;
  P[a].gold+=P[o].gold;P[o].troops=0;P[o].gold=0;P[a].wr=Math.max(0,(P[a].wr||0)-20);syncT();
  attacks=attacks.filter(x=>x.a!==o);release(o);free(o);
  for(const k in warS){const q=k.split(',');if(+q[0]===o||+q[1]===o)delete warS[k]}
  addLog(Lg(`${P[o].name}: столица пала, капитуляция перед «${P[a].name}»`,`${P[o].name}: capital fallen, surrendered to ${P[a].name}`),a===0?'good':o===0?'bad':'');
}

function adjTo(i,a){for(let k=0;k<4;k++){const j=NB[i*4+k];if(j>=0&&own[j]===a)return true}return false}
function frontier(a,t){
  const out=[];
  for(let i=0;i<N;i++){if(own[i]!==t||!terr[i])continue;if(adjTo(i,a))out.push(i)}
  return out;
}
function launch(a,t,amount){
  if(amount<1||atPeace(a,t))return;
  const seeds=[];for(let i=0;i<N;i++)if(own[i]===a&&nbOwn(i,t))seeds.push(i);
  amount=withdraw(a,amount,seeds);if(amount<1)return;
  const ex=attacks.find(x=>!x.dir&&x.a===a&&x.t===t);
  ex?ex.troops+=amount:attacks.push({a,t,troops:amount});
}
function launchDir(a,ox,oy,tx,ty,amount){
  if(amount<1)return;amount=withdraw(a,amount,[oy*W+ox]);if(amount<1)return;
  const ex=attacks.find(x=>x.dir&&x.a===a&&Math.hypot(x.tx-tx,x.ty-ty)<2*K);
  ex?ex.troops+=amount:attacks.push({a,dir:true,ox,oy,tx,ty,troops:amount});
}

// взятие клетки: потери обеих сторон
// потери зависят от перевеса: давишь слабое место — теряешь мало
function lossOf(at,i){
  const def=costOf(i),o=own[i];
  if(o<0)return{def,loss:def*.6,gar:def*.4};        // пустая земля: большинство остаётся гарнизоном
  // скидка зависит от концентрации: бойцов на клетку участка прорыва, а не от размера армии
  const conc=Math.max(0,at.troops)/Math.max(1,at.front||1),r=conc/Math.max(.01,def);
  const floor=slowZone(i)?.75:.3;   // в городах, у столиц и фортов перевес почти не спасает
  const m=Math.max(floor,Math.min(1.6,2/Math.max(.01,r)));
  const am=MD(P[at.a]);return{def,loss:def*m*(1+am.loss)/(1+am.atk),gar:0};
}
// защитник теряет только тех, кто реально стоял в клетке (укрепления его берегут, а не сжигают)
function localTroops(i){return own[i]<0?0:tr[i]}
let lostTick={};   // сколько клеток страна уже потеряла в этом тике
function takeCell(at,i){
  const o0=own[i];
  if(o0>=0&&(lostTick[o0]||0)>=Math.max(4*K,P[o0].cells*.004))return false;   // нельзя сожрать страну за секунды
  if(wall[i]>0){   // ломаем стену: вся атака бьёт в одну точку пролома, урон от её размера, бойцы гибнут под огнём
    if(at.wtick===tk)return 2;
    if(at.wt!==undefined&&at.wt!==i&&wall[at.wt]>0&&own[at.wt]===own[i])i=at.wt;
    at.wtick=tk;at.wt=i;
    const dmg=Math.min(wall[i],Math.max(2,at.troops*.04)*(1+MD(P[at.a]).wall)),l=Math.min(at.troops,dmg*.3);
    at.troops-=l;at.lost=(at.lost||0)+l;die(at.a,l*.7);attackerOf=at.a;hitWall(i,dmg);return 2}
  const{def,loss,gar}=lossOf(at,i);if(at.troops<loss+gar)return false;
  at.troops-=loss+gar;at.lost=(at.lost||0)+loss;die(at.a,loss*.7);   // треть раненых вернётся
  if(o0>=0)lostTick[o0]=(lostTick[o0]||0)+1;
  conquer(i,at.a);
  let g=gar;if(o0>=0){g=Math.min(at.troops*.04,2+def*.3);at.troops-=g}   // в клетке остаётся гарнизон
  tr[i]+=g;P[at.a].troops+=g;at.last=i;return true;
}
const backOf=at=>Math.max(0,at.troops)+(at.lost||0)*.3;   // остаток + раненые (гарнизоны уже стоят в клетках)
const endCell=at=>at.last!==undefined?at.last:(at.dir?at.oy*W+at.ox:P[at.a].cap);
function stepBroad(at){
  if(atPeace(at.a,at.t))return false;
  const fr=frontier(at.a,at.t);
  if(!fr.length)return false;
  at.front=fr.length;
  for(let i=fr.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[fr[i],fr[j]]=[fr[j],fr[i]]}
  let lim=Math.ceil((1+fr.length*.12)*K),took=0,zone=0,bz=0;
  if(at.t<0)lim=Math.min(lim,25*K);   // по пустой земле расползаемся не мгновенно
  for(const i of fr){
    if(lim--<=0)break;
    const z=slowZone(i);if(z&&zone>=K)continue;
    const r=takeCell(at,i);if(!r)continue;if(r===2){bz=1;continue}took++;if(z)zone++;
    if(!P[at.a].alive)return false;
  }
  return (took>0||bz)&&at.troops>=1;
}
function stepDir(at){
  const dx=at.tx-at.ox,dy=at.ty-at.oy,len=Math.hypot(dx,dy)||1,ux=dx/len,uy=dy/len;
  // голова наступления идёт от начала стрелки к концу через свою землю, пока не упрётся в чужую
  if(at.head===undefined)at.head=0;
  while(at.head<len){const x=Math.floor(at.ox+.5+ux*at.head),y=Math.floor(at.oy+.5+uy*at.head);
    if(x<0||y<0||x>=W||y>=H)break;const i=y*W+x;
    if(terr[i]&&own[i]!==at.a)break;at.head+=.5}
  if(at.head>=len-.5*K)return false;          // дошли до конца стрелки
  const width=(at.narrow?.8:Math.min(3.5,1.5+Math.sqrt(at.troops)/8))*K,win=1.5*K;   // мятежники идут тонким коридором
  const cand=[],hx=at.ox+ux*at.head,hy=at.oy+uy*at.head,R=Math.ceil(win+width)+1;   // смотрим только квадрат у головы
  const xa=Math.max(0,Math.floor(hx-R)),xb=Math.min(W-1,Math.ceil(hx+R)),ya=Math.max(0,Math.floor(hy-R)),yb=Math.min(H-1,Math.ceil(hy+R));
  for(let y=ya;y<=yb;y++)for(let x=xa,i=y*W+xa;x<=xb;x++,i++){
    if(own[i]===at.a||!terr[i]||atPeace(at.a,own[i]))continue;
    const rx=cx_(i)-at.ox,ry=cy_(i)-at.oy,t=rx*ux+ry*uy;
    if(t<at.head-win||t>at.head+win)continue;  // только у головы, а не по всему коридору
    const p=Math.abs(rx*uy-ry*ux);if(p>width)continue;
    if(adjTo(i,at.a))cand.push([(t-at.head)*.4-p,i]);
  }
  if(!cand.length)return false;
  at.front=Math.max(2,Math.min(cand.length,width*2));
  cand.sort((a,b)=>b[0]-a[0]);
  let lim=Math.ceil((1+width/K*.5)*K*1.5*(1+MD(P[at.a]).arrow)),took=0,zone=0,bz=0;
  for(const[,i]of cand){
    if(lim--<=0)break;
    const z=slowZone(i);if(z&&zone>=K)continue;
    const r=takeCell(at,i);if(!r)continue;if(r===2){bz=1;continue}took++;if(z)zone++;
    {const t=(cx_(i)-at.ox)*ux+(cy_(i)-at.oy)*uy;if(t>at.head)at.head=t}   // голова идёт за прорывом, даже если он сбоку
    if(!P[at.a].alive)return false;
  }
  return (took>0||bz)&&at.troops>=1;
}

// ---------- флот ----------
// флот выходит из своего форта у моря: ближайший такой форт к началу стрелки
function shipFrom(a,x0,y0,tx,ty){
  let best=null,bd=1e9;const R=Math.ceil(2.5*K);
  for(const f of forts){if(own[f]!==a)continue;const d=Math.hypot(cx_(f)-x0,cy_(f)-y0);if(d>=bd)continue;
    let w=-1,wd=1e9;
    for(let dy=-R;dy<=R;dy++)for(let dx=-R;dx<=R;dx++){const x=cx_(f)+dx,y=cy_(f)+dy;if(x<0||y<0||x>=W||y>=H)continue;const j=y*W+x;
      if(terr[j]||dx*dx+dy*dy>R*R)continue;const q=Math.hypot(x-tx,y-ty);if(q<wd){wd=q;w=j}}
    if(w>=0){bd=d;best={f,w}}}
  return best}
function launchShip(a,ox,oy,tx,ty,amount){
  const st=shipFrom(a,ox,oy,tx,ty);if(!st)return false;
  const sx=cx_(st.w),sy=cy_(st.w),dx=tx-sx,dy=ty-sy,l=Math.hypot(dx,dy)||1;
  amount=withdraw(a,amount,[st.f]);if(amount<1)return false;P[a].gold-=SHIP_GOLD;
  ships.push({id:++shipId,a,x:sx+.5,y:sy+.5,ux:dx/l,uy:dy/l,troops:amount,dist:0});return true;
}
function stepShips(){
  const guns=[];
  for(const p of P)if(p.alive)guns.push(p.cap);
  for(const f of forts)guns.push(f);
  for(let n=ships.length-1;n>=0;n--){
    const sh=ships[n],A=P[sh.a];
    if(!A.alive){ships.splice(n,1);continue}
    sh.x+=sh.ux*SHIP_V;sh.y+=sh.uy*SHIP_V;sh.dist+=SHIP_V;
    const cx=Math.floor(sh.x),cy=Math.floor(sh.y);
    if(cx<0||cy<0||cx>=W||cy>=H){ships.splice(n,1);if(sh.a===0)addLog(Lg('Флот ушёл в открытое море и пропал','Your fleet sailed into open sea and was lost'),'bad');continue}
    const i=cy*W+cx;
    if(!terr[i]){
      for(const g of guns){const o=own[g];if(o<0||o===sh.a||atPeace(o,sh.a))continue;
        if(Math.hypot(cx_(g)+.5-sh.x,cy_(g)+.5-sh.y)<=4.5*K){die(sh.a,sh.troops*.06);sh.troops*=.94}}
      if(sh.troops<1){ships.splice(n,1);if(sh.a===0)addLog(Lg('Флот потоплен береговой обороной','Your fleet was sunk by coastal defenses'),'bad')}
      continue;
    }
    if(sh.dist<1.6)continue;           // ещё отходит от своего берега
    ships.splice(n,1);
    const o=own[i];
    if(o>=0&&o!==sh.a&&!atWar(sh.a,o))declareWar(sh.a,o);
    if(o===sh.a||atPeace(sh.a,o)){deposit(sh.a,sh.troops,i);continue}
    if(wall[i]>0){attackerOf=sh.a;hitWall(i,sh.troops*.6);if(sh.a===0||o===0)addLog(Lg(`Десант «${A.name}» разбился о стены`,`${A.name} landing broke against the walls`),o===0?'good':'bad');continue}
    const c=costOf(i);
    if(sh.troops<c){die(sh.a,sh.troops);if(sh.a===0||o===0)addLog(Lg(`Десант «${A.name}» разбит на берегу`,`${A.name} landing defeated on the shore`),o===0?'good':'bad');continue}
    sh.troops-=c;die(sh.a,c);
    conquer(i,sh.a);
    const tx=Math.max(0,Math.min(W-1,Math.round(cx+sh.ux*12*K))),ty=Math.max(0,Math.min(H-1,Math.round(cy+sh.uy*12*K)));
    if(sh.troops>=1)attacks.push({a:sh.a,dir:true,ox:cx,oy:cy,tx,ty,troops:sh.troops});
    if(sh.a===0||o===0)addLog(Lg(`Десант «${A.name}» высадился`,`${A.name} landing succeeded`),sh.a===0?'good':'bad');
  }
}

function tick(){
  if(paused||over)return;
  clock+=TICK/1000;
  if(++tk%10===0)refresh();
  lostTick={};
  syncT();
  for(const p of P)p.gr=p.alive?Math.max(0,Math.min(cap(p)-p.troops,growth(p))):0;
  spawn();flow();front();
  payGold();for(const p of P)p.iron+=p.inc[3];stepCease();
  for(let n=attacks.length-1;n>=0;n--){
    const at=attacks[n];if(!at)continue;const A=P[at.a];
    if(!A.alive){attacks.splice(n,1);continue}
    const goOn=at.dir?stepDir(at):stepBroad(at);
    if(!goOn){deposit(at.a,backOf(at),endCell(at));const k=attacks.indexOf(at);if(k>=0)attacks.splice(k,1)}
  }
  stepShips();stepSites();stepArt();
  syncT();
  P.forEach((p,o)=>{if(!p.alive||p.cells>0)return;p.alive=false;p.troops=0;release(o);free(o);
    attacks=attacks.filter(x=>x.a!==o);for(const k in warS){const q=k.split(',');if(+q[0]===o||+q[1]===o)delete warS[k]}});
  weariness();
  for(let b=noEnd.coup?0:1;b<P.length;b++)if(P[b].alive&&Math.random()<.08)botThink(b);
  if(!P[0].alive&&!noEnd.lost){noEnd.lost=true;setMsg(Lg('Ваша страна пала — мир живёт дальше','Your country has fallen; the world goes on'),'err');addLog(Lg('Ваша страна пала. Можно смотреть дальше или начать заново','Your country has fallen. Keep watching or start over'),'bad')}
  else if(P[0].alive&&!noEnd.coup&&!noEnd.won&&P.every((p,k)=>!p.alive||rootOf(k)===0)){noEnd.won=true;addLog(Lg('Вы объединили континент. Мир живёт дальше','You united the continent. The world goes on'),'good')}
}

// ---------- живой мир: доход, торговля, рост городов, дороги ----------
let lifeT=0;
function worldLife(){
  for(let o=0;o<P.length;o++){const p=P[o];p.inc=p.alive?incomeOf(o):[0,0,0,0];if(p.alive)p.inc[1]*=Math.max(0,1+MD(p).gold);p.cpow=0;p.tradeG=0;p.trade=[]}
  for(let i=0;i<N;i++)if(bld[i]===1&&own[i]>=0)P[own[i]].cpow+=csz[i]||1;
  for(const p of P)if(p.alive)p.cpow+=1;   // столица
  // торговые пути: соседи, которые не воюют, торгуют сами — обоим золото и часть ресурсов друг друга
  const nb=new Set();
  for(let i=0;i<N;i++){const a=own[i];if(a<0)continue;for(let k=1;k<4;k+=2){const j=NB[i*4+k];if(j>=0&&own[j]>=0&&own[j]!==a)nb.add(a<own[j]?a*64+own[j]:own[j]*64+a)}}
  trades=[];const base=P.map(p=>p.inc.slice());
  for(const key of nb){const a=(key/64)|0,b=key%64;if(!P[a].alive||!P[b].alive||atWar(a,b))continue;
    const A0=P[a],B0=P[b],v=.02+.006*(cpow(A0)+cpow(B0))+.004*(quarries.filter(q=>own[q]===a||own[q]===b).length);
    A0.tradeG+=v*expMul(A0);B0.tradeG+=v*expMul(B0);A0.trade.push(b);B0.trade.push(a);trades.push([a,b,v]);
    for(const t of[2,3]){const ia=base[a][t],ib=base[b][t];A0.inc[t]+=ib*.25;B0.inc[t]+=ia*.25}}   // обмен едой и железом
  if(++lifeT%5)return;   // ниже — раз в 5 секунд
  // рост городов: в мире, со снабжением и связью со столицей
  for(let i=0;i<N;i++){if(bld[i]!==1||own[i]<0)continue;const o=own[i];
    if((csz[i]||1)<3&&dist[i]>=0&&(fd[i]<0||fd[i]>5*K)&&roadOK(i)&&Math.random()<.1){csz[i]=(csz[i]||1)+1;
      if(o===0)addLog(Lg(`Город вырос до ${['','посёлка','города','большого города'][csz[i]]}`,`A city grew into a ${['','village','town','large city'][csz[i]]}`),'good')}}
  // новые поселения сами появляются на освоенной земле
  for(let o=0;o<P.length;o++){const p=P[o];if(!p.alive||Math.random()>.35)continue;
    if(p.cities>=Math.floor(p.cells/900))continue;
    const hubs=[p.cap];for(let i=0;i<N;i++)if(bld[i]===1&&own[i]===o)hubs.push(i);
    let best=-1,bs=-1e9;
    for(let t=0;t<220;t++){const i=(Math.random()*N)|0;if(own[i]!==o||bld[i]||terr[i]===3||dist[i]<0||(fd[i]>=0&&fd[i]<6*K))continue;
      let md=1e9;for(const h of hubs)md=Math.min(md,Math.hypot(cx_(h)-cx_(i),cy_(h)-cy_(i)));if(md<9*K)continue;
      let coast=0;for(let k=0;k<4;k++){const j=NB[i*4+k];if(j>=0&&!terr[j])coast=1}
      const sc=-Math.abs(md-11*K)+res[i]*6+coast*4+Math.random()*3;if(sc>bs){bs=sc;best=i}}
    if(best>=0){bld[best]=1;csz[best]=1;p.cities++;if(o===0)addLog(Lg('На вашей земле вырос новый посёлок','A new village grew on your land'),'good')}}
  rebels();
  buildRoads();
}
// дороги: города страны связываются в сеть (минимальное дерево), если между ними своя земля
function buildRoads(){
  roads=[];
  for(let o=0;o<P.length;o++){const p=P[o];if(!p.alive)continue;
    const nodes=[p.cap];for(let i=0;i<N;i++)if(bld[i]===1&&own[i]===o)nodes.push(i);
    const inT=[0],rest=new Set(nodes.map((_,k)=>k).slice(1));
    while(rest.size){let bd=1e9,ba=-1,bb=-1;
      for(const a of inT)for(const b of rest){const d=Math.hypot(cx_(nodes[a])-cx_(nodes[b]),cy_(nodes[a])-cy_(nodes[b]));if(d<bd){bd=d;ba=a;bb=b}}
      rest.delete(bb);if(bd>30*K||!lineOwn(nodes[ba],nodes[bb],o))continue;inT.push(bb);roads.push([nodes[ba],nodes[bb],o])}}
}
function lineOwn(a,b,o){const l=Math.hypot(cx_(a)-cx_(b),cy_(a)-cy_(b))||1;let bad=0;
  for(let t=0;t<=l;t+=1){const x=Math.floor(cx_(a)+.5+(cx_(b)-cx_(a))*t/l),y=Math.floor(cy_(a)+.5+(cy_(b)-cy_(a))*t/l),i=y*W+x;if(own[i]!==o)bad++}
  return bad<=l*.15}
function roadOK(i){for(const r of roads)if(r[0]===i||r[1]===i)return true;return false}

// ---------- постройки ----------
function canBuild(a,i,type){
  if(i<0||own[i]!==a||bld[i]||i===P[a].cap)return Lg('Здесь нельзя строить','Cannot build here');
  if(type===4){ensureP(P[a]);if(!artOn(a))return Lg('Нужно изучение «Артиллерия»','Requires Artillery research')}
  for(let k=0;k<N;k++)if(bld[k]&&own[k]===a&&Math.hypot(cx_(k)-cx_(i),cy_(k)-cy_(i))<3*K)return Lg('Слишком близко к другой постройке','Too close to another building');
  if(type===2){if(P[a].iron<P[a].costFort)return Lg('Не хватает железа','Not enough iron');return''}
  if(type===3&&qinfo(i).v<.05)return Lg('Здесь нет залежей','No deposits here');
  if(type===4){if(P[a].iron<ART_IRON)return Lg('Не хватает железа','Not enough iron');if(P[a].gold<P[a].costArt)return Lg('Не хватает золота','Not enough gold');return''}
  const c=type===1?P[a].costCity:P[a].costQuarry;
  if(P[a].gold<c)return Lg('Не хватает золота','Not enough gold');
  return'';
}
function build(a,i,type){
  const p=P[a];
  if(type===1){p.gold-=p.costCity;p.costCity=Math.round(p.costCity*1.3)}
  else if(type===2){p.iron-=p.costFort;p.costFort=Math.round(p.costFort*1.2)}
  else if(type===3){p.gold-=p.costQuarry;p.costQuarry=Math.round(p.costQuarry*1.3)}
  else{p.gold-=p.costArt;p.iron-=ART_IRON;p.costArt=Math.round(p.costArt*1.3)}
  bld[i]=10+type;sites.push({i,type,a,t0:clock,T:buildT(p)});   // сначала стройплощадка
}
const BN=Lg(['','город','форт','добыча','батарея'],['','city','fort','mine','battery']);
function finishBuild(s){const{i,type,a}=s,p=P[a];
  if(type===1){bld[i]=1;csz[i]=1;p.cities++}
  else if(type===2){bld[i]=2;forts.push(i)}
  else if(type===3){bld[i]=3;quarries.push(i);qv.set(i,qinfo(i))}
  else bld[i]=4;
  if(a===0)setMsg(type===3?Lg(`Добыча: ${RES[qv.get(i).t].n}`,`Mine: ${RES[qv.get(i).t].n}`):Lg(['','Город построен','Форт построен','','Батарея готова'],['','City built','Fort built','','Battery ready'])[type],'ok')}
function stepSites(){for(let n=sites.length-1;n>=0;n--){const s=sites[n];
  if(bld[s.i]!==10+s.type||own[s.i]!==s.a){if(bld[s.i]===10+s.type)bld[s.i]=0;sites.splice(n,1);continue}
  if(clock>=s.t0+s.T){sites.splice(n,1);finishBuild(s)}}}

// ---------- боты ----------
function botWar(b){
  const p=P[b];if(clock<60||lordOf(b)>=0)return;
  if(enemiesOf(b)>=(p.troops>3000?2:1)||Math.random()>.06*Math.min(1,8/Math.max(1,P.length-1)))return;   // много стран — каждая объявляет войны реже
  const nb=new Set();for(let i=0;i<N;i++){if(own[i]!==b)continue;for(let k=0;k<4;k++){const j=NB[i*4+k];if(j>=0&&own[j]>=0&&own[j]!==b)nb.add(own[j])}}
  let best=-1,bs=-1e9;const myD=p.troops/Math.max(1,p.cells);
  for(const x of nb){if(!P[x].alive||enemiesOf(x)>=2||rootOf(x)===rootOf(b)||cease[wk(b,x)])continue;   // на того, с кем уже воюют двое, не лезем
    const sc=myD/Math.max(.01,P[x].troops/Math.max(1,P[x].cells))*(.7+Math.random()*.6)+(p.hate[x]||0)*.01-enemiesOf(x)*1.2-(x===0?.25:0)-.25;   // с соседом торгуем — воевать невыгодно
    if(sc>bs){bs=sc;best=x}}
  if(best>=0&&bs>.9)declareWar(b,best);
}
// ---------- сепаратисты ----------
// вспыхивают в городах больших стран, далеко от столицы; держат города, а не сплошную землю;
// расширяются тонкими коридорами от города к городу; продержались — обретают независимость
const RCOL=['#9C6ADE','#C9B458','#6FC3B2','#B5653D','#E06C9F','#7A8B99','#5E7CE2','#D9A066'];
const rp=a=>a[(Math.random()*a.length)|0];
const town=()=>LANG==='en'?rp(['Ash','Bel','New','Stone','Oak','Lake','Red','North','Iron','Salt','Green','Grey','Elm','Brook'])+rp(['ford','ton','burg','wick','field','port','vale','mouth','by','ham']):rp(['Крас','Бел','Нов','Зар','Сол','Лоз','Гор','Степ','Яс','Камен','Дуб','Озер','Сер','Чер','Слав','Дружк','Торец','Север'])+rp(['ово','инск','огорск','ополь','ец','ино','ичи','ов','ань','ск','одонецк']);
function spawnRebel(h,city){
  let o=-1;for(let k=6;k<P.length;k++)if(!P[k].alive&&P[k].cells<=0){o=k;break}
  if(o<0){if(P.length>=40)return;o=P.length}
  for(const k in warS){const q=k.split(',');if(+q[0]===o||+q[1]===o)delete warS[k]}
  for(const x of P)if(x.hate)delete x.hate[o];
  const nm=Lg('Республика '+town(),town()+' Republic'),col=RCOL[o%RCOL.length];
  P[o]=({name:nm,color:col,rgb:hex(col),troops:0,gold:50,iron:0,food:0,inc:[0,0,0,0],tradeG:0,trade:[],cells:0,cities:0,alive:true,bot:true,cap:city,
    hate:{[h]:60},mob:1,costCity:150,costFort:60,costQuarry:150,rebel:true,host:h,born:clock,q:[]});
  const R=2.6*K,x0=cx_(city),y0=cy_(city),cells=[];
  for(let dy=-Math.ceil(R);dy<=R;dy++)for(let dx=-Math.ceil(R);dx<=R;dx++){if(dx*dx+dy*dy>R*R)continue;
    const x=x0+dx,y=y0+dy;if(x<0||y<0||x>=W||y>=H)continue;const i=y*W+x;if(terr[i]&&own[i]===h&&i!==P[h].cap){conquer(i,o);cells.push(i)}}
  const force=150+P[h].troops*.12;for(const i of cells)tr[i]=force/cells.length;
  warS[wk(o,h)]=clock;
  addLog(h===0?Lg(`Восстание на вашей земле: «${nm}»`,`Uprising on your land: ${nm}`):Lg(`«${nm}» откололась от «${P[h].name}»`,`${nm} broke away from ${P[h].name}`),h===0?'bad':'');
}
function rebels(){
  const big=P.filter(x=>x.alive&&!x.rebel).length;
  for(let h=0;h<P.length;h++){const p=P[h];if(!p.alive||p.rebel)continue;
    const ch=Math.max(0,p.cells/land-.22)*.12+(big===1?.15:0)+Math.max(0,(p.wr||0)-50)*.0025,far=(p.wr||0)>50?5*K:10*K;
    if(Math.random()>ch)continue;
    let best=-1,bs=-1;
    for(let i=0;i<N;i++){if(bld[i]!==1||own[i]!==h||capZone(i)<far||(fd[i]>=0&&fd[i]<4*K))continue;
      const sc=capZone(i)*(.6+Math.random()*.8)*(clock-since[i]<120?1.6:1);if(sc>bs){bs=sc;best=i}}
    if(best>=0)spawnRebel(h,best)}
  for(const p of P)if(p.alive&&p.rebel&&(clock-p.born>180||(p.cities>=2&&clock-p.born>90))){
    p.rebel=false;addLog(Lg(`«${p.name}» обрела независимость`,`${p.name} gained independence`),p.host===0?'bad':'good')}
}
function rebelThink(b){
  const p=P[b];for(let i=0;i<N;i++)if(own[i]===b&&bld[i]===1)tr[i]+=1.5;   // приток добровольцев
  if(p.troops<40||attacks.some(a=>a.a===b))return;
  const mine=[];for(let i=0;i<N;i++)if(own[i]===b&&bld[i]===1)mine.push(i);if(!mine.length)mine.push(p.cap);
  let best=null,bd=1e9;
  for(let c=0;c<N;c++){if(bld[c]!==1||own[c]<0||own[c]===b||!atWar(b,own[c]))continue;
    for(const m of mine){const d=Math.hypot(cx_(c)-cx_(m),cy_(c)-cy_(m));if(d<bd&&d<26*K){bd=d;best=[m,c]}}}
  if(!best)return;
  launchDir(b,cx_(best[0]),cy_(best[0]),cx_(best[1]),cy_(best[1]),p.troops*.6);
  const at=attacks[attacks.length-1];if(at&&at.a===b)at.narrow=true;
}
const coastal=i=>{for(let k=0;k<4;k++){const j=NB[i*4+k];if(j>=0&&!terr[j])return true}return false};
function botTech(b){const p=P[b];
  if(Math.random()<.04){const c=TECH.filter(t=>!p.tOwn.includes(t.id)&&p.gold>=t.c+120);if(c.length)buyTech(b,rp(c).id)}
  if(p.tOn.length<3){const id=p.tOwn.find(x=>!p.tOn.includes(x)&&(p.tCd[x]||0)<=clock);if(id)toggleTech(b,id)}}
function botArt(b){const p=P[b];if(!artOn(b)||enemiesOf(b)===0)return;
  const bs=batteries(b);
  if(bs.length<1+Math.floor(cpow(p)/3)&&p.gold>=p.costArt+60&&p.iron>=ART_IRON&&Math.random()<.25)
    for(let t=0;t<30;t++){const i=(Math.random()*N)|0;if(own[i]!==b||fd[i]<3*K||fd[i]>9*K)continue;if(!canBuild(b,i,4)){build(b,i,4);break}}
  if(p.marks.length>=2)return;
  const rd=bs.filter(x=>(artCd[x]||0)<=clock);if(!rd.length)return;
  const g=rp(rd),gx=cx_(g),gy=cy_(g),R=Math.floor(ART_MAX);let best=null,bv=0;
  for(let dy=-R;dy<=R;dy+=2)for(let dx=-R;dx<=R;dx+=2){const d2=dx*dx+dy*dy;if(d2>R*R||d2<ART_MIN*ART_MIN)continue;
    const x=gx+dx,y=gy+dy;if(x<0||y<0||x>=W||y>=H)continue;const j=y*W+x,o=own[j];if(o<0||o===b||!atWar(b,o))continue;
    const sc=(wall[j]>0?300:0)+(bld[j]===4?150:0)+tr[j]*(1+Math.random()*.3);if(sc>bv){bv=sc;best=[x+.5,y+.5,0]}}
  for(const z of ships){if(z.a===b||!atWar(b,z.a)||!inRange(g,z.x,z.y))continue;if(z.troops>bv){bv=z.troops;best=[z.x,z.y,z.id]}}
  if(best&&bv>8)p.marks.push({x:best[0],y:best[1],s:best[2]})}
// прорыв: самый сильный котёл бьёт к ближайшей своей снабжаемой земле
function botBreakout(b){
  const seen=new Uint8Array(N);let best=null;
  for(let i=0;i<N;i++){if(own[i]!==b||dist[i]>=0||seen[i])continue;const c=[i];seen[i]=1;let t=0,sx=0,sy=0;
    for(let n=0;n<c.length;n++){const v=c[n];t+=tr[v];sx+=cx_(v);sy+=cy_(v);
      for(let k=0;k<4;k++){const j=NB[v*4+k];if(j>=0&&own[j]===b&&dist[j]<0&&!seen[j]){seen[j]=1;c.push(j)}}}
    if(c.length>=3*A&&t>20&&(!best||t>best.t))best={c,t,x:sx/c.length,y:sy/c.length}}
  if(!best)return false;
  let tg=-1,td=1e9;for(let i=0;i<N;i+=2)if(own[i]===b&&dist[i]>=0){const d=Math.hypot(cx_(i)-best.x,cy_(i)-best.y);if(d<td){td=d;tg=i}}
  if(tg<0)return false;
  let og=-1,od=1e9;for(const v of best.c){const d=Math.hypot(cx_(v)-cx_(tg),cy_(v)-cy_(tg));if(d<od){od=d;og=v}}
  if(attacks.some(a=>a.a===b&&a.dir&&a.ox===cx_(og)&&a.oy===cy_(og)))return false;
  launchDir(b,cx_(og),cy_(og),cx_(tg),cy_(tg),best.t*.7);return true}
function botThink(b){
  const p=P[b];ensureP(p);
  if(p.rebel){rebelThink(b);return}
  botTech(b);botArt(b);
  botWar(b);if(Math.random()<.15)botTreaty(b);
  if(Math.random()<.3&&botBreakout(b))return;
  // стройка
  const myQ=quarries.filter(q=>own[q]===b).length;
  if(p.gold>=p.costQuarry&&(myQ<2||Math.random()<.2)&&Math.random()<.5){
    let bi=-1,bv=-1;
    const need=p.inc[1]<.15?1:p.inc[2]<=p.inc[3]?2:3;
    for(let k=0;k<120;k++){const i=(Math.random()*N)|0;if(own[i]!==b)continue;const v=res[i]*(resT[i]===need?1:.35);if(v>bv&&!canBuild(b,i,3)){bv=v;bi=i}}
    if(bi>=0){build(b,bi,3);return}
  }
  if(Math.random()<.3){
    const type=p.cities<=forts.filter(f=>own[f]===b).length||p.iron<p.costFort?1:2;
    if(type===1?p.gold>=p.costCity:p.iron>=p.costFort){
      const mine=[];for(let i=0;i<N;i++)if(own[i]===b)mine.push(i);
      for(let t=0;t<12;t++){const i=mine[(Math.random()*mine.length)|0];
        const border=[0,1,2,3].some(k=>{const j=NB[i*4+k];return j>=0&&terr[j]&&own[j]!==b});
        if((type===1&&!border)||(type===2&&(border||coastal(i)))){if(!canBuild(b,i,type)){build(b,i,type);break}}}
    }
  }

let mode='menu',GO={name:Lg('Вы','You'),color:'#4C8DF6',rivals:5,mapId:'',mapName:Lg('Случайная','Random')},curSlot=null,gameActive=false;
const PCOL=['#4C8DF6','#E0524A','#E8A33D','#49B06A','#4FC8D6','#D96BA0','#9C6ADE','#C9B458','#E8E3D6'];
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}};
const readJ=(k,d)=>{try{return JSON.parse(LS.get(k)||'')||d}catch(e){return d}};
const b64e=u8=>{let s='';for(let i=0;i<u8.length;i+=32768)s+=String.fromCharCode.apply(null,u8.subarray(i,i+32768));return btoa(s)};
const b64d=s=>{const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};
async function gz(u8,dir){
  const S=dir?window.CompressionStream:window.DecompressionStream;if(!S)return null;
  try{return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(new S('gzip'))).arrayBuffer())}catch(e){return null}}
const fmtDate=t=>{const d=new Date(t);return d.toLocaleDateString(Lg('ru-RU','en-GB'),{day:'numeric',month:'short'})+' '+d.toLocaleTimeString(Lg('ru-RU','en-GB'),{hour:'2-digit',minute:'2-digit'})};
const fmtClock=c=>{const m=Math.floor(c/60);return m<60?Lg(`${m} мин`,`${m} min`):Lg(`${Math.floor(m/60)} ч ${m%60} мин`,`${Math.floor(m/60)} h ${m%60} min`)};

// ---------- упаковка мира ----------
function arrays(){return[['own',own,1],['terr',terr,1],['bld',bld,1],['csz',csz,1],['resT',resT,1],['res',res,'q8'],
  ['tr',tr,4],['wall',wall,'q16'],['prog',prog,'q8'],['since',since,4],['cut',cut,4]]}
async function packState(){
  const parts=[],offs={};let n=0;
  for(const[k,a,t]of arrays()){let u;
    if(t==='q8'){u=new Uint8Array(N);for(let i=0;i<N;i++)u[i]=Math.max(0,Math.min(255,Math.round(a[i]*255)))}
    else if(t==='q16'){const v=new Uint16Array(N);for(let i=0;i<N;i++)v[i]=Math.max(0,Math.min(65535,Math.round(a[i])));u=new Uint8Array(v.buffer)}
    else u=new Uint8Array(a.buffer.slice(a.byteOffset,a.byteOffset+a.byteLength));
    offs[k]=[n,u.length];parts.push(u);n+=u.length}
  const all=new Uint8Array(n);let o=0;for(const u of parts){all.set(u,o);o+=u.length}
  const meta=JSON.stringify({v:1,W,H,clock,tk,lifeT,logArr,noEnd,warS,forts,quarries,qv:[...qv.entries()],attacks,ships,P,GO,cease,wallLog,offs,speed,sites,shells,artCd,fortHits,shipId});   // снимок до await
  const z=await gz(all,true);
  return '{"m":'+meta+',"z":'+(z?1:0)+',"b":"'+b64e(z||all)+'"}';
}
async function unpackState(str){
  const s=JSON.parse(str),m=s.m;if(!(m.W>0&&m.H>0))throw new Error('size');setGrid(m.W,m.H);
  let all=b64d(s.b);if(s.z){all=await gz(all,false);if(!all)throw new Error('gzip')}
  const get=k=>{const[o,l]=m.offs[k];return all.slice(o,o+l)};
  own=new Int8Array(get('own').buffer);terr=get('terr');bld=get('bld');csz=get('csz');resT=get('resT');
  {const u=get('res');for(let i=0;i<N;i++)res[i]=u[i]/255}
  tr=new Float32Array(get('tr').buffer);
  {const v=new Uint16Array(get('wall').buffer);for(let i=0;i<N;i++)wall[i]=v[i]}
  {const u=get('prog');for(let i=0;i<N;i++)prog[i]=u[i]/255}
  since=new Float32Array(get('since').buffer);cut=new Float32Array(get('cut').buffer);
  wallHit.fill(-99);
  ({clock,tk,lifeT,logArr,noEnd,warS,forts,quarries,attacks,ships,P,GO,wallLog}=m);speed=m.speed||1;
  for(const x of $('speed').children)x.classList.toggle('on',+x.dataset.s===speed);
  sites=m.sites||[];shells=m.shells||[];artCd=m.artCd||{};fortHits=m.fortHits||{};shipId=m.shipId||0;booms=[];
  for(const sh of ships)if(!sh.id)sh.id=++shipId;P.forEach(ensureP);
  qv=new Map(m.qv);buildNB();land=0;for(let i=0;i<N;i++)if(terr[i])land++;
  over=false;paused=false;buildMode=0;selC=-1;setBuildMode(0);$('dipl').hidden=true;$('pause').textContent=Lg('Пауза','Pause');
  depotT={};cease=m.cease||{};offers=[];$('tre').hidden=$('offer').hidden=true;dist.fill(-1);refresh();buildRoads();renderLog();
}

// ---------- слоты ----------
const saveList=()=>readJ('rub_saves',[]);
async function saveGame(silent){
  if(!curSlot||!gameActive)return;
  const slot=curSlot,sum={clock,map:GO.mapName,land:Math.round(P[0].cells/land*100),alive:P[0].alive,coup:!!noEnd.coup};
  let data;try{data=await packState()}catch(e){if(!silent)setMsg(Lg('Не получилось сохранить','Could not save'),'err');return}
  if(!LS.set('rub_save_'+slot.id,data)){if(!silent)setMsg(Lg('Нет места для сохранения: удали старые в меню','No space to save: delete old saves in the menu'),'err');return}
  const L=saveList().filter(x=>x.id!==slot.id);
  L.unshift(Object.assign({id:slot.id,name:slot.name,date:Date.now()},sum));
  LS.set('rub_saves',JSON.stringify(L));if(!silent)setMsg(Lg('Сохранено','Saved'),'ok');
}
async function loadSlot(id){
  const data=LS.get('rub_save_'+id);if(!data){alertMenu(Lg('Сохранение не найдено','Save not found'));return}
  try{await unpackState(data)}catch(e){gameActive=false;curSlot=null;$('mResume').hidden=true;alertMenu(Lg('Сохранение повреждено или от другой версии','Save is corrupted or from another version'));return}
  const meta=saveList().find(x=>x.id===id);curSlot={id,name:meta?meta.name:GO.name};gameActive=true;closeMenu();
}
async function downloadText(name,text){
  if(window.claude&&window.claude.use){let dl=null;try{dl=await window.claude.use('downloads')}catch(e){}   // внутри claude.ai — через его окно сохранения
    if(dl){try{await dl.save({filename:name,data:text})}catch(e){if(e&&e.code!=='declined')alertMenu(Lg('Не получилось скачать файл','Could not download the file'))}return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));
  a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- редактор карт ----------
let ED={id:null,tool:1,size:4,starts:[]};
function blankWorld(){own=new Int8Array(N).fill(-1);bld=new Uint8Array(N);csz.fill(0);urban.fill(0);wall.fill(0);dist.fill(-1);tr.fill(0);prog.fill(0);res.fill(0);resT.fill(0);
  P=[];attacks=[];ships=[];sites=[];shells=[];booms=[];forts=[];quarries=[];qv=new Map();roads=[];trades=[];warS={}}
function openEditor(id){
  if(gameActive)saveGame(true);gameActive=false;curSlot=null;
  setGrid(96*K,60*K);
  const m=id?mapById(id):null;ED={id:m?m.id:null,tool:1,size:+$('edSize').value,starts:m?[...m.starts]:[]};
  if(m){terr=b64d(m.terr);buildNB()}else genMap();
  blankWorld();$('edName').value=m?m.name:Lg('Моя карта','My map');
  mode='edit';$('dock').hidden=true;closeHQ();$('menu').hidden=true;$('gamePanel').hidden=true;$('edPanel').hidden=false;setEdTool(1);resize();draw();
}
function setEdTool(t){ED.tool=t;for(const b of $('edTools').children)b.classList.toggle('on',b.dataset.t==String(t))}
function edPaint(c){
  if(c.x<0||c.y<0||c.x>=W||c.y>=H)return;
  const r=ED.size*K/2,R=Math.ceil(r);
  for(let dy=-R;dy<=R;dy++)for(let dx=-R;dx<=R;dx++){if(dx*dx+dy*dy>r*r+.5)continue;const x=c.x+dx,y=c.y+dy;if(x<0||y<0||x>=W||y>=H)continue;terr[y*W+x]=ED.tool}
  ED.starts=ED.starts.filter(i=>terr[i])
}
function edStart(c){
  if(c.i<0)return;const k=ED.starts.findIndex(i=>Math.hypot(cx_(i)-c.x,cy_(i)-c.y)<4*K);
  if(k>=0){ED.starts.splice(k,1);return}
  if(!terr[c.i]){$('edMsg').textContent=Lg('Старт ставится на сушу','Starts must be on land');return}
  if(ED.starts.length>=6){$('edMsg').textContent=Lg('Не больше 6 стартов','At most 6 starts');return}
  ED.starts.push(c.i);$('edMsg').textContent='';
}
function drawEditor(){
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.textAlign='center';ctx.textBaseline='middle';
  ED.starts.forEach((i,k)=>{const x=SX(cx_(i)),y=SY(cy_(i)),col=k===0?GO.color:DEFS[k][1];
    ctx.fillStyle=col;ctx.strokeStyle='#0D1216';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,11,0,7);ctx.fill();ctx.stroke();
    ctx.fillStyle='#0D1216';ctx.font="600 12px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif";ctx.fillText(k===0?Lg('Я','Me'):String(k),x,y+.5)});
}
$('edTools').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const t=b.dataset.t;setEdTool(isNaN(+t)?t:+t)});
$('edSize').addEventListener('input',e=>{ED.size=+e.target.value;$('edSizeV').textContent=e.target.value});
$('edRandom').addEventListener('click',()=>{genMap();blankWorld();ED.starts=[];draw()});
$('edClear').addEventListener('click',()=>{terr.fill(0);ED.starts=[];draw()});
$('edSave').addEventListener('click',()=>{

  const L=mapList(),id=ED.id||'m'+Date.now(),rec={id,name:($('edName').value.trim()||Lg('Моя карта','My map')).slice(0,32),terr:b64e(terr),starts:ED.starts};
  const k=L.findIndex(x=>x.id===id);if(k>=0)L[k]=rec;else L.unshift(rec);
  if(!LS.set('rub_maps',JSON.stringify(L))){$('edMsg').textContent=Lg('Нет места: удали старые карты или сохранения','No space: delete old maps or saves');return}
  ED.id=id;GO.mapId=id;$('edMsg').textContent=Lg('Карта сохранена','Map saved');
});
